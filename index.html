<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoopVerse — The Skill Verification Protocol</title>
    
    <!-- Primary Meta Tags (SEO) -->
    <meta name="title" content="LoopVerse — The Skill Verification Protocol" />
    <meta name="description" content="LoopVerse replaces unverified credentials with AI-validated, cryptographically proven skill profiles. One ecosystem. Zero fiction." />
    <meta name="author" content="LoopVerse" />
    <meta name="keywords" content="LoopVerse, campus, skill verification, AI hiring, blockchain identity, education, recruitment, AI agent, crypto protocol" />
    <meta name="theme-color" content="#000000" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph / Facebook (SMO) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://loopverse.xyz/" />
    <meta property="og:title" content="LoopVerse — The Skill Verification Protocol" />
    <meta property="og:description" content="Replaces unverified credentials with AI-validated, cryptographically proven skill profiles." />
    <meta property="og:image" content="/og-loopverse.png" />

    <!-- Twitter (SMO) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://loopverse.xyz/" />
    <meta name="twitter:title" content="LoopVerse — The Skill Verification Protocol" />
    <meta name="twitter:description" content="Replaces unverified credentials with AI-validated, cryptographically proven skill profiles." />
    <meta name="twitter:site" content="@loopverse" />
    <meta name="twitter:image" content="/og-loopverse.png" />

    <!-- Schema.org Markup (GEO / AEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LoopVerse",
        "url": "https://loopverse.xyz",
        "logo": "https://loopverse.xyz/favicon.png",
        "description": "The Skill Verification Protocol replacing unverified credentials with AI-validated profiles.",
        "sameAs": [
          "https://twitter.com/loopverse"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LoopVerse Protocol",
        "url": "https://loopverse.xyz",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://loopverse.xyz/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
